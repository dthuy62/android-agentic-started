name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Only pull requests cancel older runs; a run reused by distribute.yml must never be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug detekt ktlintCheck
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  release-build:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build unsigned release APK (R8)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

  agent-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test hooks and agent instruction files
        run: python3 -m unittest discover -s tools/agents -t tools/agents
