name: Distribute

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes (leave empty to list the commits since the previous build)
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  distribute:
    needs: verify
    # Repository-level variable: environment variables are not readable in a job-level `if`.
    if: ${{ vars.FIREBASE_APP_ID != '' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: distribution
    concurrency:
      group: distribute-develop
      cancel-in-progress: false
    outputs:
      version_code: ${{ steps.version.outputs.code }}
    env:
      CI: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check required secrets
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in FIREBASE_SERVICE_ACCOUNT_JSON ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::FIREBASE_APP_ID is set, so distribution is enabled, but these secrets are empty:$missing"
            exit 1
          fi

      - name: Compute version code
        id: version
        env:
          OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
        run: echo "code=$(( ${OFFSET:-0} + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p build
          if [ -n "$INPUT_NOTES" ]; then
            printf '%s\n' "$INPUT_NOTES" > build/release_notes.txt
          else
            previous=$(git describe --tags --match 'build-*' --abbrev=0 "$GITHUB_SHA" 2>/dev/null || true)
            if [ -n "$previous" ]; then range="$previous..$GITHUB_SHA"; else range="-10 $GITHUB_SHA"; fi
            git log --no-merges --pretty='- %s' $range > build/release_notes.txt
          fi
          if [ ! -s build/release_notes.txt ]; then
            echo "No functional changes since the previous build." > build/release_notes.txt
          fi
          head -c 4000 build/release_notes.txt > build/release_notes.tmp
          mv build/release_notes.tmp build/release_notes.txt

      - name: Prepare signing and Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-credentials.json"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build and distribute
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          FIREBASE_CREDENTIALS_FILE: ${{ runner.temp }}/firebase-credentials.json
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          bundle exec fastlane android distribute

      - name: Remove credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/firebase-credentials.json" "$RUNNER_TEMP/release.keystore"

      # A signed APK in a public repository would be downloadable by anyone, so keep it for private repositories only.
      - name: Upload APK and R8 mapping
        if: ${{ success() && github.event.repository.private }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          retention-days: 7
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

  tag:
    needs: distribute
    if: ${{ needs.distribute.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_CODE: ${{ needs.distribute.outputs.version_code }}
    steps:
      - name: Tag the distributed commit
        run: |
          tag="build-$VERSION_CODE"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag already exists"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
